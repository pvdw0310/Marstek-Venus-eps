<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Venus EPS</title>
<style>
  /* ------------------------------------------------------------
     Noodverlichting-thema: donker (blackout!), amber accenten,
     alles self-contained — geen externe fonts of CDN's, want
     tijdens een stroomuitval is er mogelijk geen internet.
     ------------------------------------------------------------ */
  :root {
    --bg: #0b0f14;
    --panel: #131a22;
    --line: #22303d;
    --tekst: #e8eaed;
    --dim: #8a97a3;
    --amber: #ffb020;
    --groen: #4ade80;
    --rood: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--tekst);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    min-height: 100dvh;
    padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
    max-width: 480px; margin: 0 auto;
  }

  /* --- Taalschakelaar rechtsboven ------------------------------ */
  #taalbalk {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 14px;
    display: flex; gap: 2px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
  }
  #taalbalk button {
    all: unset; padding: 6px 11px; font-size: 12px; font-weight: 700;
    color: var(--dim); cursor: pointer; letter-spacing: .04em;
  }
  #taalbalk button.actief { background: var(--amber); color: #1a1205; }

  header { text-align: center; margin-bottom: 8px; margin-top: 6px; }
  header h1 {
    font-size: 15px; font-weight: 600; letter-spacing: .22em;
    text-transform: uppercase; color: var(--dim);
  }
  header h1 b { color: var(--amber); font-weight: 700; }
  #devnaam {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px; color: var(--dim); margin-top: 4px; min-height: 16px;
  }

  /* --- Het stopcontact: signature element ----------------------- */
  #socketwrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px 0; }
  #socket {
    width: min(64vw, 250px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #1b2530, #10161d 70%);
    border: 3px solid var(--line);
    position: relative; cursor: pointer;
    transition: box-shadow .4s, border-color .4s;
    touch-action: manipulation;
  }
  #socket::before {
    content: ""; position: absolute; left: 50%; top: 22%;
    width: 11%; aspect-ratio: 1; border-radius: 50%;
    transform: translateX(-50%);
    background: #2c3946; border: 2px solid var(--line);
    transition: background .4s;
  }
  .gat {
    position: absolute; top: 55%; width: 13%; aspect-ratio: 1;
    border-radius: 50%; background: #05080b;
    border: 2px solid var(--line);
    transform: translateY(-50%);
    transition: box-shadow .4s;
  }
  .gat.links  { left: 26%; }
  .gat.rechts { right: 26%; }

  #socket.aan { border-color: var(--groen); box-shadow: 0 0 42px rgba(74,222,128,.35), inset 0 0 30px rgba(74,222,128,.08); }
  #socket.aan .gat { box-shadow: 0 0 14px rgba(74,222,128,.8), inset 0 0 6px rgba(74,222,128,.6); }
  #socket.aan::before { background: var(--groen); }
  #socket.bezig { border-color: var(--amber); animation: puls 1s infinite; }
  @keyframes puls {
    0%,100% { box-shadow: 0 0 12px rgba(255,176,32,.15); }
    50%     { box-shadow: 0 0 34px rgba(255,176,32,.5); }
  }
  #socket:active { transform: scale(.97); }
  @media (prefers-reduced-motion: reduce) { #socket.bezig { animation: none; } }

  #staat {
    text-align: center; font-size: 20px; font-weight: 700; min-height: 28px;
    margin-bottom: 2px;
  }
  #staat.aan { color: var(--groen); }
  #staat.uit { color: var(--dim); }
  #staat.fout { color: var(--rood); }
  #substaat { text-align: center; font-size: 13px; color: var(--dim); min-height: 18px; margin-bottom: 14px; }

  .rij { display: flex; gap: 10px; margin-bottom: 10px; }
  button {
    flex: 1; padding: 16px; font-size: 16px; font-weight: 700;
    border-radius: 14px; border: 1px solid var(--line);
    background: var(--panel); color: var(--tekst);
    cursor: pointer; touch-action: manipulation;
  }
  button:disabled { opacity: .35; }
  #btnAan  { border-color: rgba(74,222,128,.5); color: var(--groen); }
  #btnUit  { border-color: rgba(248,113,113,.4); color: var(--rood); }
  #btnVerbind { background: var(--amber); color: #1a1205; border: none; }

  details { margin-top: 10px; }
  summary { color: var(--dim); font-size: 13px; cursor: pointer; padding: 6px 2px; }
  #log {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.7; color: var(--dim);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; max-height: 34dvh; overflow-y: auto; white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #log .tx { color: var(--amber); }
  #log .rx { color: var(--groen); }
  #log .err { color: var(--rood); }
</style>
</head>
<body>

<div id="taalbalk">
  <button id="btnNL" data-taal="nl">NL</button>
  <button id="btnEN" data-taal="en">EN</button>
</div>

<header>
  <h1>Venus <b>EPS</b> <span data-i18n="ondertitel">noodstroom</span></h1>
  <div id="devnaam"></div>
</header>

<div id="socketwrap">
  <div id="socket" role="button" aria-label="EPS" tabindex="0">
    <div class="gat links"></div>
    <div class="gat rechts"></div>
  </div>
</div>

<div id="staat" class="uit"></div>
<div id="substaat"></div>

<div class="rij">
  <button id="btnVerbind"></button>
</div>
<div class="rij">
  <button id="btnAan" disabled></button>
  <button id="btnUit" disabled></button>
</div>

<details>
  <summary data-i18n="logtitel"></summary>
  <div id="log"></div>
</details>

<script>
"use strict";
/* =============================================================
   Marstek Venus E — EPS bediening via Web Bluetooth
   Protocol: HM-frame [0x73][Len][0x23][Cmd][Payload][XOR-chk]
   EPS: cmd 0x0F, payload 0x01 = aan, 0x00 = uit
   Service ff00, write ff01, notify ff02
   ============================================================= */
const SVC  = 0xff00;
const CHRW = 0xff01;
const CHRN = 0xff02;
const CMD_EPS = 0x0f;

/* ---- Vertalingen ------------------------------------------------ */
const T = {
  nl: {
    ondertitel: "noodstroom",
    logtitel: "Technische log (TX/RX frames)",
    verbind: "Verbind met batterij",
    verbreek: "Verbinding verbreken",
    epsAan: "EPS aan",
    epsUit: "EPS uit",
    nietVerbonden: "Niet verbonden",
    subNietVerbonden: "Verbind eerst met de batterij",
    bezig: "Bezig...",
    subBezig: "Commando wordt verstuurd",
    aan: "EPS AAN",
    subAan: "Backup-stopcontact levert stroom",
    uit: "EPS UIT",
    subUit: "Backup-stopcontact is uitgeschakeld",
    verbonden: "Verbonden",
    subOnbekend: "EPS-staat onbekend — kies aan of uit",
    geenBle: "Geen Web Bluetooth",
    subGeenBle: "Gebruik Chrome op Android of PC (geen Firefox/iPhone)",
    klaar: "Klaar. Sluit eerst de Marstek app volledig af (1 BLE-verbinding tegelijk).",
    offlineActief: "Offline-modus actief (service worker)",
    swFout: "Service worker niet geladen: ",
    verbindenMet: "Verbinden met ",
    geenNotify: "Geen notify-characteristic: ",
    notifActief: "Notificaties actief",
    verbrokenLog: "Verbinding verbroken",
    fout: "Fout: ",
    statusUitResp: "EPS-status uit response: ",
    verzonden: "verstuurd",
    verzendenMislukt: "Verzenden mislukt: "
  },
  en: {
    ondertitel: "backup power",
    logtitel: "Technical log (TX/RX frames)",
    verbind: "Connect to battery",
    verbreek: "Disconnect",
    epsAan: "EPS on",
    epsUit: "EPS off",
    nietVerbonden: "Not connected",
    subNietVerbonden: "Connect to the battery first",
    bezig: "Working...",
    subBezig: "Sending command",
    aan: "EPS ON",
    subAan: "Backup outlet is supplying power",
    uit: "EPS OFF",
    subUit: "Backup outlet is switched off",
    verbonden: "Connected",
    subOnbekend: "EPS state unknown — choose on or off",
    geenBle: "No Web Bluetooth",
    subGeenBle: "Use Chrome on Android or PC (not Firefox/iPhone)",
    klaar: "Ready. First fully close the Marstek app (only 1 BLE connection at a time).",
    offlineActief: "Offline mode active (service worker)",
    swFout: "Service worker not loaded: ",
    verbindenMet: "Connecting to ",
    geenNotify: "No notify characteristic: ",
    notifActief: "Notifications active",
    verbrokenLog: "Connection lost",
    fout: "Error: ",
    statusUitResp: "EPS status from response: ",
    verzonden: "sent",
    verzendenMislukt: "Sending failed: "
  }
};

let taal = "nl";
function tekst(sleutel) { return T[taal][sleutel]; }

let device = null, server = null, chWrite = null, chNotify = null;
let epsStaat = null;   // null = onbekend, true/false = laatst verstuurde/gelezen staat
let bezig = false;

const $ = id => document.getElementById(id);
const socket = $("socket"), staat = $("staat"), substaat = $("substaat");
const btnAan = $("btnAan"), btnUit = $("btnUit"), btnVerbind = $("btnVerbind");

function log(msg, cls) {
  const el = $("log");
  const t = new Date().toLocaleTimeString();
  el.innerHTML += `<span class="${cls||""}">[${t}] ${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}
const hex = bytes => [...bytes].map(b => b.toString(16).padStart(2,"0").toUpperCase()).join(" ");

function maakFrame(cmd, payload) {
  const body = [0x73, 0x00, 0x23, cmd, ...payload];
  body[1] = body.length + 1;
  let chk = 0;
  for (const b of body) chk ^= b;
  return new Uint8Array([...body, chk]);
}

/* ---- Taal toepassen -------------------------------------------- */
function zetTaal(nieuw) {
  taal = nieuw;
  document.documentElement.lang = nieuw;
  try { localStorage.setItem("venus_taal", nieuw); } catch(e){}
  $("btnNL").classList.toggle("actief", nieuw === "nl");
  $("btnEN").classList.toggle("actief", nieuw === "en");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = tekst(el.getAttribute("data-i18n"));
  });
  zetUI();
}

function zetUI() {
  const verbonden = !!(server && server.connected);
  btnAan.disabled = btnUit.disabled = !verbonden || bezig;
  btnAan.textContent = tekst("epsAan");
  btnUit.textContent = tekst("epsUit");
  btnVerbind.textContent = verbonden ? tekst("verbreek") : tekst("verbind");
  socket.classList.toggle("bezig", bezig);
  socket.classList.toggle("aan", epsStaat === true && !bezig);

  if (!verbonden) {
    staat.textContent = tekst("nietVerbonden"); staat.className = "uit";
    substaat.textContent = tekst("subNietVerbonden");
  } else if (bezig) {
    staat.textContent = tekst("bezig"); staat.className = "uit";
    substaat.textContent = tekst("subBezig");
  } else if (epsStaat === true) {
    staat.textContent = tekst("aan"); staat.className = "aan";
    substaat.textContent = tekst("subAan");
  } else if (epsStaat === false) {
    staat.textContent = tekst("uit"); staat.className = "uit";
    substaat.textContent = tekst("subUit");
  } else {
    staat.textContent = tekst("verbonden"); staat.className = "uit";
    substaat.textContent = tekst("subOnbekend");
  }
}

async function verbind() {
  if (server && server.connected) { device.gatt.disconnect(); return; }
  if (!navigator.bluetooth) {
    staat.textContent = tekst("geenBle"); staat.className = "fout";
    substaat.textContent = tekst("subGeenBle");
    return;
  }
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "MST" }],
      optionalServices: [SVC]
    });
    device.addEventListener("gattserverdisconnected", () => {
      log(tekst("verbrokenLog"), "err");
      chWrite = chNotify = null; bezig = false; zetUI();
    });
    log(tekst("verbindenMet") + device.name + " ...");
    server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    chWrite = await svc.getCharacteristic(CHRW);
    try {
      chNotify = await svc.getCharacteristic(CHRN);
      await chNotify.startNotifications();
      chNotify.addEventListener("characteristicvaluechanged", e => {
        const v = new Uint8Array(e.target.value.buffer);
        log("RX: " + hex(v), "rx");
        if (v.length >= 5 && v[0] === 0x73 && v[3] === CMD_EPS) {
          epsStaat = (v[4] === 0x01);
          log(tekst("statusUitResp") + (epsStaat ? tekst("aan") : tekst("uit")));
          zetUI();
        }
      });
      log(tekst("notifActief"));
    } catch (e) { log(tekst("geenNotify") + e.message, "err"); }
    $("devnaam").textContent = device.name;
    log(tekst("verbonden"));
    zetUI();
  } catch (e) {
    log(tekst("fout") + e.message, "err");
    zetUI();
  }
}

async function stuurEps(aan) {
  if (!chWrite || bezig) return;
  bezig = true; zetUI();
  try {
    const frame = maakFrame(CMD_EPS, [aan ? 0x01 : 0x00]);
    log("TX: " + hex(frame), "tx");
    await chWrite.writeValue(frame);
    epsStaat = aan;
    log("EPS " + (aan ? tekst("aan") : tekst("uit")) + " " + tekst("verzonden"));
  } catch (e) {
    log(tekst("verzendenMislukt") + e.message, "err");
    staat.className = "fout";
  } finally {
    bezig = false; zetUI();
  }
}

btnVerbind.addEventListener("click", verbind);
btnAan.addEventListener("click", () => stuurEps(true));
btnUit.addEventListener("click", () => stuurEps(false));
const socketKlik = () => {
  if (!server || !server.connected) { verbind(); return; }
  if (epsStaat === null) return;
  stuurEps(!epsStaat);
};
socket.addEventListener("click", socketKlik);
socket.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); socketKlik(); } });

$("btnNL").addEventListener("click", () => zetTaal("nl"));
$("btnEN").addEventListener("click", () => zetTaal("en"));

/* ---- Starttaal: opgeslagen keuze > telefoontaal > NL ----------- */
let startTaal = "nl";
try {
  const bewaard = localStorage.getItem("venus_taal");
  if (bewaard === "nl" || bewaard === "en") startTaal = bewaard;
  else if ((navigator.language || "").toLowerCase().startsWith("en")) startTaal = "en";
} catch(e){}
zetTaal(startTaal);

log(tekst("klaar"));

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
    .then(() => log(tekst("offlineActief")))
    .catch((e) => log(tekst("swFout") + e.message, "err"));
}
</script>
</body>
</html>
